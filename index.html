<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="soft-paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('nz-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night-ink' : 'soft-paper';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root {
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-hand: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 56px;
  --radius-sm: 4px; --radius-md: 8px; --radius-pill: 999px;
  --wobble-sm: 255px 15px 225px 15px/15px 225px 15px 255px;
  --wobble-lg: 18px 6px 22px 5px/5px 22px 6px 18px;
  --stroke-hair: 1px; --stroke-hand: 1.5px; --stroke-node: 1.8px;
}
[data-theme="soft-paper"] { --page:#e6e1d3; --surface:#eeeadf; --sunk:#ddd7c7; --ink:#2b2a26; --ink-muted:#5c584f; --line:#cfc8b7; --accent:#2f6b4f; --accent-soft:#d3e1d6; --on-accent:#f2eee4; --info:#3b6283; --info-soft:#d5dfe7; --ok:#2f6b4f; --ok-soft:#d3e1d6; --warn:#7e5310; --warn-soft:#eadbbc; --bad:#9e3f35; --bad-soft:#ebd2cc; --code-bg:#dcd6c6; --code-ink:#2b2a26; --highlight:#e3cf8e; }
[data-theme="dusk"] { --page:#d3cdbe; --surface:#ddd8ca; --sunk:#c9c2b1; --ink:#24231f; --ink-muted:#4f4b43; --line:#bcb4a1; --accent:#265940; --accent-soft:#c3d3c5; --on-accent:#f2eee4; --info:#30557a; --info-soft:#c3cfd9; --ok:#265940; --ok-soft:#c3d3c5; --warn:#6b480d; --warn-soft:#dcc9a4; --bad:#8a372e; --bad-soft:#dcc1ba; --code-bg:#c7c0ae; --code-ink:#24231f; --highlight:#d9c27a; }
[data-theme="graphite"] { --page:#2a2c29; --surface:#323531; --sunk:#3a3d38; --ink:#e2e2da; --ink-muted:#aeb0a7; --line:#4a4d46; --accent:#8fbf9f; --accent-soft:#33453a; --on-accent:#1f211e; --info:#9db8d3; --info-soft:#344150; --ok:#8fbf9f; --ok-soft:#33453a; --warn:#e0b865; --warn-soft:#4a4128; --bad:#ec9785; --bad-soft:#4d312c; --code-bg:#242623; --code-ink:#e2e2da; --highlight:#5a4e2a; }
[data-theme="night-ink"] { --page:#1f1e1b; --surface:#282723; --sunk:#302f2a; --ink:#ddd7ca; --ink-muted:#a39d91; --line:#3d3b35; --accent:#86b497; --accent-soft:#253229; --on-accent:#1f1e1b; --info:#93afcb; --info-soft:#232c36; --ok:#86b497; --ok-soft:#253229; --warn:#d9ae62; --warn-soft:#3a3119; --bad:#e5907f; --bad-soft:#3d2622; --code-bg:#191815; --code-ink:#ddd7ca; --highlight:#4f4423; }
[data-theme="deep-forest"] { --page:#141a17; --surface:#1b2320; --sunk:#222c28; --ink:#d3dcd5; --ink-muted:#93a49b; --line:#2f3b36; --accent:#7cc29a; --accent-soft:#1e3329; --on-accent:#141a17; --info:#8fb3d1; --info-soft:#1c2a33; --ok:#7cc29a; --ok-soft:#1e3329; --warn:#e0b865; --warn-soft:#352d17; --bad:#eb9482; --bad-soft:#3a221e; --code-bg:#0f1411; --code-ink:#d3dcd5; --highlight:#46401f; }

/* components (暖紙墨綠 bundle) */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; font-family: var(--font-sans); font-size: 15px; line-height: 27px; background: var(--page); color: var(--ink); }
code { font-family: var(--font-mono); font-size: .86em; background: var(--sunk); color: var(--ink); padding: 1px 6px; border-radius: var(--radius-sm); }
.nz-mark { background: linear-gradient(transparent 55%, var(--highlight) 55%); color: var(--ink); }
.nz-eyebrow { font-family: var(--font-mono); font-size: 11.5px; line-height: 16px; font-weight: 600; color: var(--ink-muted); letter-spacing: .02em; text-transform: uppercase; display: block; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px dashed var(--accent); outline-offset: 3px; }
.nz-btn { font: inherit; font-size: 13px; line-height: 20px; font-weight: 500; padding: 5px 12px; border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-sm); background: var(--surface); color: var(--ink); cursor: pointer; }
.nz-badge { display: inline-block; font-size: 12px; line-height: 20px; font-weight: 500; padding: 0 var(--space-2); border-radius: var(--radius-pill); background: var(--sunk); color: var(--ink); white-space: nowrap; }
.nz-badge-ok { background: var(--ok-soft); color: var(--ok); }
.nz-badge-warn { background: var(--warn-soft); color: var(--warn); }
.nz-badge-bad { background: var(--bad-soft); color: var(--bad); }
.nz-badge-info { background: var(--info-soft); color: var(--info); }
.nz-callout { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); background: var(--warn-soft); color: var(--ink); border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); font-size: 14px; line-height: 24px; margin-top: var(--space-4); }
.nz-callout b { color: var(--warn); }
.nz-callout-icon { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: var(--radius-pill); background: var(--warn); color: var(--page); display: grid; place-items: center; font-weight: 700; font-size: 13px; line-height: 1; }
.nz-callout-ok { background: var(--ok-soft); } .nz-callout-ok .nz-callout-icon { background: var(--ok); } .nz-callout-ok b { color: var(--ok); }
.nz-callout-info { background: var(--info-soft); } .nz-callout-info .nz-callout-icon { background: var(--info); } .nz-callout-info b { color: var(--info); }
.nz-callout-bad { background: var(--bad-soft); } .nz-callout-bad .nz-callout-icon { background: var(--bad); } .nz-callout-bad b { color: var(--bad); }
.nz-card { background: var(--surface); color: var(--ink); border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); padding: var(--space-4); }
.nz-card-title { font-size: 16px; line-height: 25px; font-weight: 700; margin: var(--space-1) 0; }
.nz-card-body { font-size: 14px; line-height: 24px; color: var(--ink-muted); margin: 0; }
.nz-flow { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-4); background: var(--surface); border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); margin-top: var(--space-3); }
.nz-flow-bare { background: none; border: 0; padding: var(--space-2) 0; }
.nz-node { flex: 1; min-width: 0; text-align: center; padding: 10px var(--space-2); font-family: var(--font-hand); font-size: 15px; line-height: 22px; color: var(--ink); background: var(--surface); border: var(--stroke-node) solid var(--ink); border-radius: var(--wobble-sm); }
.nz-node code { font-size: 12px; padding: 0 4px; }
.nz-node-start { background: var(--sunk); }
.nz-node-key { background: var(--accent-soft); }
.nz-node-end { background: var(--ok-soft); }
.nz-node-bad { background: var(--bad-soft); }
.nz-arrow { flex: none; width: 30px; height: 16px; fill: none; stroke: currentColor; stroke-width: var(--stroke-node); stroke-linecap: round; stroke-linejoin: round; color: var(--ink); }
.nz-list { background: var(--surface); border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); overflow: hidden; margin-top: var(--space-3); }
.nz-list-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: 10px var(--space-4); border-top: var(--stroke-hair) solid var(--line); font-size: 14px; line-height: 22px; }
.nz-list-row:first-child { border-top: 0; }
.nz-list-row .nz-badge { min-width: 96px; text-align: center; margin-top: 1px; }
.nz-list-title { flex: 1; min-width: 0; }
.nz-list-title small { display: block; color: var(--ink-muted); font-size: 13px; line-height: 21px; }
.nz-note { display: inline-block; max-width: 230px; padding: var(--space-3) var(--space-4); background: var(--highlight); color: var(--ink); font-family: var(--font-hand); font-size: 15px; line-height: 22px; border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); transform: rotate(-2deg); }

/* page */
.topnav { position: sticky; top: 0; z-index: 10; background: var(--page); border-bottom: var(--stroke-hair) solid var(--line); }
.topnav .in { max-width: 940px; margin: 0 auto; padding: 8px var(--space-6); display: flex; align-items: center; gap: var(--space-3); }
.topnav nav { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.topnav nav::-webkit-scrollbar { display: none; }
.topnav nav a { flex: none; font-size: 13px; color: var(--ink-muted); text-decoration: none; padding: 2px 9px; border-radius: var(--radius-pill); white-space: nowrap; }
.topnav nav a:hover { color: var(--ink); background: var(--sunk); }
.topnav select { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px; background-repeat: no-repeat; flex: none; }
.wrap { max-width: 940px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-7); }
.hero { display: grid; grid-template-columns: 1fr auto; gap: var(--space-5); align-items: end; }
.display { font-family: var(--font-hand); font-size: 44px; line-height: 52px; font-weight: 700; margin: var(--space-2) 0 var(--space-2); }
.meta { font-size: 14px; line-height: 22px; color: var(--ink-muted); margin: 0; }
.tldr { margin: var(--space-5) 0 0; font-size: 19px; line-height: 32px; font-weight: 500; max-width: 760px; }
section { margin-top: var(--space-7); scroll-margin-top: 56px; }
h2 { font-size: 25px; line-height: 35px; font-weight: 900; margin: var(--space-1) 0 var(--space-2); }
h3 { font-size: 16px; line-height: 25px; font-weight: 700; margin: var(--space-5) 0 0; }
p { margin: 0 0 var(--space-3); }
.lead { color: var(--ink-muted); max-width: 680px; }
figure { margin: var(--space-4) 0 0; }
.fig { background: var(--surface); border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); padding: var(--space-4); overflow-x: auto; }
.fig svg { display: block; width: 100%; height: auto; min-width: 600px; }
.fig.narrow svg { min-width: 460px; max-width: 660px; }
figcaption { font-size: 13px; line-height: 21px; color: var(--ink-muted); margin-top: var(--space-2); }
figcaption .nz-eyebrow { display: inline; margin-right: var(--space-2); }
.fig svg path { stroke: var(--ink); stroke-width: var(--stroke-node); stroke-linejoin: round; stroke-linecap: round; }
.fig svg path.grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; }
.fig svg path.tick { stroke: var(--ink-muted); stroke-width: 1.2; }
.f-accent { fill: var(--accent-soft); } .f-info { fill: var(--info-soft); } .f-warn { fill: var(--warn-soft); }
.f-sunk { fill: var(--sunk); } .f-surface { fill: var(--surface); } .f-ok { fill: var(--ok-soft); } .f-bad { fill: var(--bad-soft); }
.fig svg path.f-dash { fill: var(--surface); stroke-dasharray: 6 5; }
.arr { fill: none; }
.dot-ok { fill: var(--ok); } .dot-info { fill: var(--info); } .dot-warn { fill: var(--warn); } .dot-ink { fill: var(--ink); }
svg text { fill: var(--ink); }
svg text.muted { fill: var(--ink-muted); }
svg text.accent-ink { fill: var(--accent); }
.t-hand { font-family: var(--font-hand); } .t-sans { font-family: var(--font-sans); } .t-mono { font-family: var(--font-mono); }
.t-xl { font-size: 24px; font-weight: 700; } .t-lg { font-size: 19px; font-weight: 700; }
.t-md { font-size: 15px; } .t-sm { font-size: 13px; } .t-xs { font-size: 11.5px; }
.cards { display: grid; gap: var(--space-3); margin-top: var(--space-3); }
.cards.cols-2 { grid-template-columns: 1fr 1fr; }
.cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
.related { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-5); }
.related a { display: block; text-decoration: none; color: var(--ink); }
.related a:hover .nz-card { background: var(--sunk); }
.related .nz-card-title::after { content: " ↗"; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-top: var(--space-4); }
.stat { padding: var(--space-3) var(--space-4); }
.stat-num { font-family: var(--font-hand); font-size: 26px; line-height: 34px; font-weight: 700; }
.stat-label { font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.fine { font-size: 13px; line-height: 21px; color: var(--ink-muted); margin: var(--space-2) 0 0; }
details.more { margin-top: var(--space-4); }
details.more summary { cursor: pointer; font-weight: 700; font-size: 15px; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "＋ "; color: var(--accent); }
details.more[open] summary::before { content: "－ "; }
.tw { overflow-x: auto; border: var(--stroke-hand) solid var(--ink); border-radius: var(--wobble-lg); background: var(--surface); margin-top: var(--space-3); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; line-height: 22px; }
td { padding: 7px var(--space-4); border-top: var(--stroke-hair) solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td:first-child { white-space: nowrap; width: 1%; }
tr.grp td { background: var(--sunk); font-weight: 700; font-size: 13px; }
.src h3 { margin-top: var(--space-4); font-size: 14px; }
.src ul { margin: var(--space-1) 0 0; padding-left: var(--space-5); font-size: 14px; line-height: 25px; }
.src li small { color: var(--ink-muted); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); font-size: 13px; color: var(--ink-muted); margin-top: var(--space-3); align-items: center; }
footer { margin-top: var(--space-7); padding-top: var(--space-4); border-top: var(--stroke-hair) solid var(--line); font-size: 13px; color: var(--ink-muted); }

@media (max-width: 760px) {
  .wrap { padding: var(--space-4) var(--space-4) var(--space-7); }
  .topnav .in { padding: 6px var(--space-4); }
  .display { font-size: 32px; line-height: 40px; }
  .hero { grid-template-columns: 1fr; }
  .hero .nz-note { justify-self: start; }
  .cards.cols-2, .cards.cols-3, .related { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .nz-flow { flex-direction: column; align-items: stretch; }
  .nz-flow .nz-arrow { transform: rotate(90deg); align-self: center; margin: 4px 0; }
  .nz-list-row { flex-direction: column; gap: var(--space-1); }
  .nz-list-row .nz-badge { min-width: 0; }
}
</style>
<style>
.notes { display: grid; gap: var(--space-3); margin-top: var(--space-5); }
.notes a { display: block; text-decoration: none; color: var(--ink); }
.notes a:hover .nz-card { background: var(--sunk); }
.notes .nz-card-title::after { content: " →"; color: var(--accent); }
.bar select { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="nz-eyebrow">notes</span>
    <select class="nz-btn" id="theme" aria-label="切換亮度">
      <option value="soft-paper">柔光紙</option>
      <option value="dusk">暮色</option>
      <option value="graphite">石墨</option>
      <option value="night-ink">夜讀暖墨</option>
      <option value="deep-forest">深林</option>
    </select>
  </div>
  <h1 class="display">筆記</h1>
  <div class="notes">
    <a href="lauren-tan/"><div class="nz-card"><span class="nz-eyebrow">AI 工程 · 資料截至 2026-11-19</span><p class="nz-card-title">Lauren Tan 的 AI 開發工程</p><p class="nz-card-body">她的心法、防線、驗證、外迴圈、pstack 現況、數字與爭議，附來源</p></div></a>
  </div>
</div>
<script>
  (function () {
    var sel = document.getElementById('theme');
    sel.value = document.documentElement.dataset.theme;
    sel.addEventListener('change', function () {
      document.documentElement.dataset.theme = sel.value;
      try { localStorage.setItem('nz-theme', sel.value); } catch (e) {}
    });
  })();
</script>
</body>
</html>
